<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的數學學習路線</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="數學路線">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.hello{font-size:15px;color:var(--mute)}
.start{font-size:34px;font-weight:700;line-height:1.15;margin:2px 0}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.path li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.path .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--soft)}
.path li.done .n{background:var(--ok);color:#fff}.path li.now{border-color:var(--acc);border-width:2px}.path li.now .n{background:var(--acc);color:#fff}
.path li.off{opacity:.55}
.mtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:10px}
.mtabs button{border:0;background:none;font:inherit;font-weight:500;color:var(--mute);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;min-height:44px}
.mtabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.mtabs button:disabled{opacity:.4;cursor:default}
.oops{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);padding:10px 14px;border-radius:0 8px 8px 0}
.qbox{font-size:22px;padding:14px 0;line-height:1.7}
.ans{display:flex;gap:8px}.ans input{font-size:20px;flex:0 1 260px;min-width:0}.ans .btn{flex:none}.ahint{margin:6px 0 0;font-size:15px;color:var(--mute)}.ahint b{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;color:var(--ink);background:var(--soft);padding:0 5px;border-radius:4px}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.mc button{font:inherit;font-size:17px;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:48px}
.mc button.sel{border-color:var(--acc);border-width:2px}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)}.fb.no{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.dots{display:flex;gap:6px;margin:6px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.now{outline:2px solid var(--acc);outline-offset:1px}
.tiers{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.stepl{font-size:18px;padding:6px 0}
.big-ok{font-size:28px;font-weight:700;color:var(--ok)}
.inst{margin-top:14px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo{background:color-mix(in srgb,var(--warn) 16%,transparent);border-radius:8px;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>我的數學學習路線</h1><span class="mute" id="who"></span><span style="flex:1"></span><button class="btn hidden" id="out" hidden>登出</button></div></header>
<main class="wrap" id="app"><p class="mute">載入中…</p></main>
<script src="config.js"></script>
<script src="modules.js"></script>
<script src="mock.js"></script>
<script src="store.js"></script>
<script>
{
const L=window.Learn,$=s=>document.querySelector(s),app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,me=null,prog={},cur=null,tick=0;
const PREVIEW=/[?&]preview\b/.test(location.search); // 老師預覽：所有關卡開放、不存紀錄（只有老師帳號能進）
const now=()=>Date.now();
/* ---------- 加到手機桌面 ---------- */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const UA=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&'ontouchend' in document),inApp=/Line\/|FBAN|FBAV|Instagram/i.test(UA);
function installHTML(){if(isStandalone())return'';
  if(inApp)return`<div class="inst">你現在是在 LINE 裡面開啟的。請按右上角「⋯」→「用預設瀏覽器開啟」，才能把這個網頁加到手機桌面。</div>`;
  if(deferredInstall)return`<div class="inst"><button class="btn p" id="instBtn">加到手機桌面</button><span>之後點桌面上的圖示就能直接進來。</span></div>`;
  if(isIOS)return`<div class="inst">加到手機桌面：用 Safari 開啟，按下方的「分享」按鈕 →「加入主畫面」。</div>`;
  return`<div class="inst">加到手機桌面：按瀏覽器右上角「⋮」→「加到主畫面」或「安裝應用程式」。</div>`;}
function refreshInstall(){document.querySelectorAll('.instWrap').forEach(w=>{w.innerHTML=installHTML();});const b=document.getElementById('instBtn');
  if(b)b.onclick=async()=>{const e=deferredInstall;if(!e)return;e.prompt();try{await e.userChoice;}catch{}deferredInstall=null;refreshInstall();};}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;refreshInstall();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;refreshInstall();});
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
const preFor=m=>Object.keys(L.PRE).find(k=>L.PRE[k].includes(m));

/* ---------- 登入 ---------- */
async function showLogin(msg=''){
  me=null;$('#who').textContent='';$('#out').hidden=true;
  let demoBtns='';
  if(S.mode==='demo'){let st=await S.listStudents();
    if(!Object.keys(st).length){await S.putStudents(window.LEARN_MOCK.students.map(L.record).filter(Boolean));st=await S.listStudents();}
    demoBtns=`<div class="demo" style="margin-top:14px">示範模式：資料只存在這台裝置。點一位模擬學生直接進入。${S.fallback?'（Firebase 連不上：'+esc(S.fallback)+'）':''}</div>
    <div class="row" style="margin-top:8px">${Object.values(st).sort((a,b)=>a.seat-b.seat).map(x=>`<button class="btn" data-demo="${esc(x.seat)}">${esc(x.seat)} 號 ${esc(x.name)}</button>`).join('')}</div>`;}
  app.innerHTML=`<div class="card" style="max-width:460px;margin:30px auto 0"><h2>登入</h2><p class="mute">輸入座號和姓名，就能看到你自己的學習路線。</p>
   <div class="row"><label>座號 <input id="seat" inputmode="numeric" style="width:90px"></label><label>姓名 <input id="name" style="width:150px"></label></div>
   <div class="row" style="margin-top:12px"><button class="btn p" id="go">進入</button><span class="mute" id="lm" role="status">${esc(msg)}</span></div>${demoBtns}<div class="instWrap"></div></div>`;
  refreshInstall();
  $('#go').onclick=()=>login($('#seat').value,$('#name').value);
  $('#name').onkeydown=e=>{if(e.key==='Enter')login($('#seat').value,$('#name').value);};
  app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=async()=>{const x=await S.getStudent(b.dataset.demo);login(x.seat,x.name);});
}
async function login(seat,name){
  seat=String(seat).replace(/\D/g,'');name=String(name).trim();
  if(!seat||!name){$('#lm').textContent='請輸入座號和姓名。';return;}
  $('#lm').textContent='登入中…';
  try{const x=await S.getStudent(seat);
    if(!x||x.name!==name){$('#lm').textContent='找不到這位學生，請確認座號和姓名，或請老師幫你建立資料。';return;}
    me=x;prog=await S.getProgress(seat)||{};
    try{localStorage.setItem('learn-me',JSON.stringify({seat,name}));}catch{}
    S.log(seat,{t:now(),k:'login'});
    $('#who').textContent=`${me.seat} 號 ${me.name}`;$('#out').hidden=false;showHome();
  }catch(e){$('#lm').textContent='連線失敗，請稍後再試（'+e.message+'）';}
}
$('#out').onclick=()=>{try{localStorage.removeItem('learn-me');}catch{}showLogin();};

/* ---------- 路線首頁 ---------- */
/* ---------- 升級前測的狀態（存在 progress/{座號}/_lvl） ---------- */
const LV='_lvl';
function lvState(){const v=prog[LV]=prog[LV]||{};if(v.level==null)v.level=me.start;v.opened=v.opened||[];v.wrong=v.wrong||[];v.tries=v.tries||[];return v;}
function curLevel(){return prog[LV]?.level??me.start;}
/* 目前開放的路線：原路線中年級 ≤ 目前年級的關卡（起點以上先鎖住；已經開始過的保留），再加上升級前測開放的關卡 */
function routeAll(){if(PREVIEW)return me.route;const base=me.route.filter(m=>L.CAT[m].grade<=(me.start??0)||prog[m]); // 起點以上的節點由升級前測依序加入 opened
  const op=(prog[LV]?.opened||[]).filter(m=>!base.includes(m));return [...base,...op];}
/* 測驗中起點以上年級的錯題關卡：通過升級前測後才開放 */
function laterRoute(){if(PREVIEW)return[];const all=routeAll();return me.route.filter(m=>!all.includes(m));}
function built(){return routeAll().filter(m=>L.MOD[m]);}
/* 起點以下的年級全部開放（可自由練習）；起點以上（含起點）依序解鎖 */
const lowOpen=m=>L.CAT[m].grade<(me.start??0);
function nextOpen(){return built().find(m=>!lowOpen(m)&&prog[m]?.status!=='done')||null;}
function extras(){const all=routeAll();return L.CATALOG.filter(c=>c.grade<(me.start??0)&&L.MOD[c.id]&&!all.includes(c.id)).map(c=>c.id);}
function showHome(){
  cur=null;const nx=PREVIEW?null:nextOpen();const doneN=built().filter(m=>prog[m]?.status==='done').length;
  app.innerHTML=(PREVIEW?`<div class="card"><div class="hello">老師預覽模式</div><p style="margin:6px 0 0">${built().length} 個關卡全部開放，可以不照順序點進去看；練習的三層和出場券也可以直接切換。這裡的作答<b>不會儲存</b>，也不會出現在學生紀錄裡。</p></div>
   <h3 style="margin-top:22px">所有關卡（由低年級到高年級）</h3>`:`<div class="card"><div class="hello">${esc(me.name)}，這是你的學習起點</div><div class="start">${me.start>=9?'國中範圍全部通過':'從「'+esc(me.startLabel)+'」開始'}</div>
   <div class="ladder">${(me.bands||[]).map((b,g)=>`<div class="${b[2]?'lp':'lf'} ${g===me.start?'start':''}">${L.GN[g]}<br>${b[0]}/${b[1]}</div>`).join('')}</div>
   <p class="mute">綠色是測驗已經通過的年級，紅框是你的起點。已完成 ${doneN} / ${built().length} 個關卡。</p>
   ${me.start>0?`<p style="margin:6px 0 0">${me.start>=9?'所有關卡都可以自由點開練習。':`${L.GN[me.start-1]}以下的關卡隨時可以點開練習；從起點「${esc(L.GN[me.start])}」開始的關卡，要完成上一關才會解鎖。`}</p>`:''}</div>
   <h3 style="margin-top:22px">我的學習路線</h3>`)+`
   <ol class="path">${routeAll().map((m,i)=>{const c=L.CAT[m],has=!!L.MOD[m],p=prog[m];const done=p?.status==='done';const open=has&&(PREVIEW||done||lowOpen(m)||m===nx);
     return `<li class="${done?'done':m===nx?'now':''} ${!has?'off':''}"><span class="n">${done?'✓':i+1}</span>
      <div><b>${esc(c.name)}</b><div class="mute">${L.GN[c.grade]}${me.miss?.[m]?'・測驗第 '+me.miss[m].join('、')+' 題':preFor(m)?'・'+esc(L.CAT[preFor(m)].name)+'的預備觀念':prog[LV]?.opened?.includes(m)?'・升級前測開放'+(prog[LV].wrong?.includes(m)?'（前測答錯，先學這關）':''):''}</div></div>
      <div>${!has?'<span class="tag off">老師準備中</span>':open?`<button class="btn ${m===nx?'p':''}" data-m="${m}">${done?'複習':p?'繼續':'開始'}</button>`:'<span class="tag">完成上一關後解鎖</span>'}</div></li>`;}).join('')}</ol>
   ${!PREVIEW&&built().every(m=>prog[m]?.status==='done')?levelCard():''}
   ${laterRoute().length?`<h3 style="margin-top:22px">之後的年級（通過升級前測後開放）</h3><p class="mute" style="margin:0 0 8px">測驗中這些年級也有錯的題目。先完成上面的關卡，再通過升級前測，就會一個年級一個年級開放。</p>
   <ol class="path">${laterRoute().map(m=>{const c=L.CAT[m];return `<li class="off"><span class="n">🔒</span><div><b>${esc(c.name)}</b><div class="mute">${L.GN[c.grade]}${me.miss?.[m]?'・測驗第 '+me.miss[m].join('、')+' 題':''}</div></div><div><span class="tag">${L.GN[c.grade]}前測後開放</span></div></li>`;}).join('')}</ol>`:''}
   ${!PREVIEW&&extras().length?`<h3 style="margin-top:22px">更低年級的其他關卡（想複習就點開）</h3><p class="mute" style="margin:0 0 8px">這些不在你的路線上，但隨時可以練習。</p>
   <ol class="path">${extras().map(m=>{const c=L.CAT[m],p=prog[m],done=p?.status==='done';return `<li class="${done?'done':''}"><span class="n">${done?'✓':'・'}</span><div><b>${esc(c.name)}</b><div class="mute">${L.GN[c.grade]}</div></div><div><button class="btn" data-m="${m}">${done?'複習':p?'繼續':'練習'}</button></div></li>`;}).join('')}</ol>`:''}<div class="instWrap"></div>`;
  refreshInstall();
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openModule(b.dataset.m));
  if($('#lvgo'))$('#lvgo').onclick=startLevelTest;
}

/* ---------- 升級前測：路線全部完成後出現。10 題：1～5 複習已完成的關卡，6～10 是下一個年級。
   前 5 題答對 4 題以上 → 開放下一個年級的全部關卡（答錯的排前面）；未達 → 先複習答錯的關卡，可再挑戰。 ---------- */
function levelCard(){const N=curLevel()+1;const lv=prog[LV];
  if(N>8||me.start>=9)return built().length?'<div class="card"><span class="big-ok">九年級以前的關卡都完成了！</span><p>你真的很厲害，繼續保持。</p></div>':'';
  const last=lv?.tries?.length?lv.tries[lv.tries.length-1]:null;const rv=(lv?.review||[]).filter(m=>L.MOD[m]);
  return `<div class="card"><span class="big-ok">目前的關卡都完成了！</span>
   <p>挑戰「<b>${L.GN[N]}升級前測</b>」：共 10 題，第 1～5 題複習你學過的，第 6～10 題是${L.GN[N]}的題目。前 5 題答對 4 題以上，就會開放${L.GN[N]}的關卡。</p>
   ${last&&!last.pass&&last.to===N?`<p class="mute">上次前 5 題答對 ${last.s1} 題。${rv.length?'建議先複習：'+rv.map(m=>`<button class="btn" data-m="${m}" style="margin:2px">${esc(L.CAT[m].name)}</button>`).join(''):''}</p>`:''}
   <div class="row"><button class="btn p" id="lvgo">開始${L.GN[N]}升級前測</button></div></div>`;}
function startLevelTest(){const L0=curLevel(),N=L0+1;
  const done=Object.keys(prog).filter(m=>L.MOD[m]&&prog[m]?.status==='done');
  const pool1=done.length?done:L.CATALOG.filter(c=>c.grade<=Math.max(0,L0)&&L.MOD[c.id]).map(c=>c.id);
  const gradeN=L.CATALOG.filter(c=>c.grade===N&&L.MOD[c.id]).map(c=>c.id),fresh=gradeN.filter(m=>!routeAll().includes(m));
  const pool2=fresh.length?fresh:gradeN; // 6～10 題優先考「還沒學、要開放」的關卡
  const r=L.rng(now()%2147483647||7);const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const five=pool=>{let o=[];while(o.length<5)o.push(...shuf(pool));return o.slice(0,5);};
  const base=now()%100000;
  const qs=[...five(pool1).map((m,i)=>({m,q:L.makeQ(m,i%2,base*3+i*41+1)})),...five(pool2).map((m,i)=>({m,q:L.makeQ(m,0,base*5+i*43+2)}))];
  cur={lvl:{N,qs,i:0,res:[]}};S.log(me.seat,{t:now(),k:'lvlstart',to:N});drawLevelTest();window.scrollTo(0,0);}
function drawLevelTest(){const T=cur.lvl,it=T.qs[T.i];
  app.innerHTML=`<div class="row" style="margin-top:6px"><button class="btn" id="back">← 回到路線</button></div>
   <h2 style="margin-top:14px">${L.GN[T.N]}升級前測</h2><p class="mute" style="margin:0">第 1～5 題複習你學過的；第 6～10 題是${L.GN[T.N]}的題目，還沒學過也沒關係，盡量寫。</p>
   <div class="card"><div class="row" style="justify-content:space-between"><b>第 ${T.i+1} / 10 題　<span class="tag">${T.i<5?'複習':L.GN[T.N]}・${esc(L.CAT[it.m].name)}</span></b>
   <span class="dots">${T.qs.map((_,i)=>`<i class="${T.res[i]===true?'ok':T.res[i]===false?'no':i===T.i?'now':''}"></i>`).join('')}</span></div><div id="qb"></div></div>`;
  $('#back').onclick=showHome;
  drawQ($('#qb'),it.q,async(ok,val)=>{T.res[T.i]=ok;S.log(me.seat,{t:now(),k:'answer',m:it.m,tier:'lvl',ok,a:String(val).slice(0,30),q:it.q.key});T.i++;
    if(T.i<10)drawLevelTest();else finishLevelTest();});}
async function finishLevelTest(){const T=cur.lvl,lv=lvState();
  const s1=T.res.slice(0,5).filter(Boolean).length,s2=T.res.slice(5).filter(Boolean).length;
  const miss1=[...new Set(T.qs.slice(0,5).filter((x,i)=>!T.res[i]).map(x=>x.m))];
  const wrong2=[...new Set(T.qs.slice(5).filter((x,i)=>!T.res[i+5]).map(x=>x.m))];
  const pass=s1>=4;let added=[];
  if(pass){const all=routeAll();const grade=L.CATALOG.filter(c=>c.grade===T.N&&L.MOD[c.id]).map(c=>c.id);
    const nodes=me.route.filter(m=>L.CAT[m].grade===T.N); // 原本測驗答錯的節點
    added=[...new Set([...wrong2,...nodes,...grade])].filter(m=>!all.includes(m));
    lv.opened.push(...added);lv.wrong=[...new Set([...lv.wrong,...wrong2.filter(m=>added.includes(m))])];lv.level=T.N;lv.review=[];}
  else lv.review=miss1;
  lv.tries.push({t:now(),to:T.N,s1,s2,pass});lv.updatedAt=now();
  await S.saveModule(me.seat,LV,lv).catch(()=>{});S.log(me.seat,{t:now(),k:'lvl',to:T.N,ok:pass,s1,s2});
  const G=L.GN[T.N];
  $('#qb').closest('.card').outerHTML=pass?`<div class="card"><span class="big-ok">通過！</span><p>複習題答對 ${s1} / 5，${G}題目答對 ${s2} / 5。</p>
     ${added.length?`<p>開放了${G}的 ${added.length} 個關卡，前測答錯和測驗答錯的排在前面：</p><ol>${added.map(m=>`<li>${esc(L.CAT[m].name)}${wrong2.includes(m)?' <span class="tag warn">前測答錯</span>':me.miss?.[m]?' <span class="tag">測驗答錯</span>':''}</li>`).join('')}</ol>`:`<p>${G}的關卡你都已經完成了，可以直接挑戰下一個年級。</p>`}
     <div class="row"><button class="btn p" id="home">回到路線</button></div></div>`
   :`<div class="card"><h3 style="margin-top:0">複習題答對 ${s1} / 5（要 4 題）</h3><p>先把下面這些關卡再複習一次，準備好再挑戰（題目會換）。${G}題目答對 ${s2} / 5。</p>
     <div class="row">${miss1.map(m=>`<button class="btn" data-m="${m}">${esc(L.CAT[m].name)}</button>`).join('')}</div>
     <div class="row" style="margin-top:10px"><button class="btn p" id="again">再挑戰一次</button><button class="btn" id="home">回到路線</button></div></div>`;
  $('#home').onclick=showHome;if($('#again'))$('#again').onclick=startLevelTest;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openModule(b.dataset.m));}
/* ---------- 模組 ---------- */
function P(m){return prog[m]=prog[m]||{status:'learning',tiers:[{n:0,c:0,passed:false},{n:0,c:0,passed:false},{n:0,c:0,passed:false}],exit:{tries:0,passed:false},time:0,startedAt:now()};}
async function save(m){const p=P(m);const t=now();p.time+=Math.min(180,Math.round((t-tick)/1000));tick=t;p.updatedAt=t;await S.saveModule(me.seat,m,p).catch(()=>{});}
function openModule(m){cur={m,tab:'concept',set:null,exit:null};tick=now();if(!prog[m]){P(m);save(m);S.log(me.seat,{t:now(),k:'start',m});}drawModule();window.scrollTo(0,0);}
function drawModule(){
  const {m,tab}=cur,M=L.MOD[m],c=L.CAT[m],p=P(m);const allPass=p.tiers.every(t=>t.passed);
  const tabs=[['concept','1 觀念'],['example','2 例題'],['practice','3 練習'],['exit','4 出場券']];
  app.innerHTML=`<div class="row" style="margin-top:6px"><button class="btn" id="back">← 回到路線</button></div>
   <h2 style="margin-top:14px">${esc(c.name)} <span class="tag">${L.GN[c.grade]}</span>${p.status==='done'?' <span class="tag ok">已完成</span>':''}</h2>
   <p class="mute" style="margin:0">目標：${M.goal}</p>
   <nav class="mtabs">${tabs.map(([k,v])=>`<button data-tab="${k}" aria-selected="${tab===k}" ${!PREVIEW&&k==='exit'&&!allPass&&p.status!=='done'?'disabled':''}>${v}${!PREVIEW&&k==='exit'&&!allPass&&p.status!=='done'?'（練習完才能開）':''}</button>`).join('')}</nav>
   <div id="body"></div>`;
  $('#back').onclick=()=>{save(m);showHome();};
  app.querySelectorAll('.mtabs button').forEach(b=>b.onclick=()=>{cur.tab=b.dataset.tab;drawModule();});
  ({concept:drawConcept,example:drawExample,practice:drawPractice,exit:drawExit})[tab]();
}
function mountWidget(el,W){let s=W.init();const draw=()=>{el.innerHTML=W.render(s)+W.controls(s);};
  el.onclick=e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;W.act(s,b.dataset.act,b.dataset.v);draw();};
  el.onchange=e=>{const i=e.target.closest('input[data-act]');if(i){W.act(s,i.dataset.act,i.value);draw();}};draw();}
function drawConcept(){const M=L.MOD[cur.m];
  $('#body').innerHTML=`<div class="card"><h3 style="margin-top:0">你可能會犯的錯</h3><div class="oops"><p style="margin:0 0 6px">${M.wrong.h}</p><p style="margin:0">${M.wrong.why}</p></div>
   <h3>觀念整理</h3><ol>${M.concept.map(x=>`<li>${x}</li>`).join('')}</ol></div>
   <div class="card"><h3 style="margin-top:0">動手試試看</h3><div id="wd"></div></div>
   <div class="row" style="margin-top:14px"><button class="btn p" id="nx">看例題 →</button></div>`;
  mountWidget($('#wd'),M.widget);$('#nx').onclick=()=>{cur.tab='example';drawModule();};
  if(!P(cur.m).concept){P(cur.m).concept=true;save(cur.m);}
}
function drawExample(){const E=L.MOD[cur.m].example;let k=1;
  const draw=()=>{$('#body').innerHTML=`<div class="card"><h3 style="margin-top:0">例題</h3><div class="qbox">${E.q}</div>
   ${E.steps.slice(0,k).map((s,i)=>`<div class="stepl"><b>第 ${i+1} 步</b>　${s}</div>`).join('')}
   <div class="row" style="margin-top:12px">${k<E.steps.length?'<button class="btn" id="more">下一步</button>':'<button class="btn p" id="nx">開始練習 →</button>'}</div></div>`;
   if($('#more'))$('#more').onclick=()=>{k++;draw();};if($('#nx'))$('#nx').onclick=()=>{cur.tab='practice';drawModule();};};
  draw();if(!P(cur.m).example){P(cur.m).example=true;save(cur.m);}
}
/* 一組 4 題：答對 3 題以上就通過這一層 */
function newSet(t){const base=(now()%100000)*7;return{t,qs:[0,1,2,3].map(i=>L.makeQ(cur.m,t,base+i*31+t)),i:0,res:[]};}
function drawQ(box,q,onDone){
  box.innerHTML=`<div class="qbox">${q.h}</div>${q.mc?`<div class="mc">${q.mc.map((o,i)=>`<button data-i="${i}">(${'ABCD'[i]}) ${o}</button>`).join('')}</div>`
    :`<div class="ans"><input id="ai" autocomplete="off" aria-label="你的答案" aria-describedby="ahint" placeholder="寫答案"><button class="btn p" id="sb">送出</button></div><p class="ahint" id="ahint">分數寫成 <b>3/4</b>（分子/分母），帶分數寫成 <b>1 3/4</b>，負數寫成 <b>-3/4</b></p>`}<div id="fb"></div>`;
  let doneOnce=false;
  const finish=(val)=>{if(doneOnce)return;const r=q.check(val);if(!r.ok&&r.note&&!q.mc&&!r.hasOwnProperty('x')&&/看不懂|格式/.test(r.note)){box.querySelector('#fb').innerHTML=`<div class="fb no">${esc(r.note)}</div>`;return;}
    doneOnce=true;box.querySelectorAll('button,input').forEach(x=>x.disabled=true);
    box.querySelector('#fb').innerHTML=`<div class="fb ${r.ok?'ok':'no'}">${r.ok?'<b>答對了！</b>':'<b>還不對。</b> 正確答案：'+q.key}${r.note?'<br>'+esc(r.note):''}${!r.ok?'<br>提示：'+q.hint:''}</div><div class="row" style="margin-top:10px"><button class="btn p" id="nq">下一題 →</button></div>`;
    box.querySelector('#nq').onclick=()=>onDone(r.ok,val);box.querySelector('#nq').focus();};
  if(q.mc)box.querySelectorAll('.mc button').forEach(b=>b.onclick=()=>{b.classList.add('sel');finish(b.dataset.i);});
  else{const i=box.querySelector('#ai');i.focus();box.querySelector('#sb').onclick=()=>finish(i.value);i.onkeydown=e=>{if(e.key==='Enter')finish(i.value);};}
}
function drawPractice(){
  const p=P(cur.m);let t=p.tiers.findIndex(x=>!x.passed);
  if(t<0&&!cur.set){$('#body').innerHTML=`<div class="card"><span class="big-ok">三層練習都通過了！</span><p>準備好就去寫出場券，3 題全對就完成這個關卡。</p><div class="row"><button class="btn p" id="nx">寫出場券 →</button><button class="btn" id="again">再多練一組挑戰題</button></div></div>`;
    $('#nx').onclick=()=>{cur.tab='exit';drawModule();};$('#again').onclick=()=>{cur.set=newSet(2);drawPractice();};return;}
  if(!cur.set||cur.set.done)cur.set=newSet(t<0?2:t);
  const set=cur.set;
  $('#body').innerHTML=`<div class="card"><div class="tiers">${L.TIERS.map((n,i)=>PREVIEW?`<button class="chip" data-pt="${i}" aria-pressed="${i===set.t}">${n}</button>`:`<span class="tag ${p.tiers[i].passed?'ok':i===set.t?'warn':''}">${n}${p.tiers[i].passed?' ✓':''}</span>`).join('')}</div>
   <div class="row" style="justify-content:space-between"><b>${L.TIERS[set.t]}練習・第 ${set.i+1} / 4 題</b><span class="dots">${set.qs.map((_,i)=>`<i class="${set.res[i]===true?'ok':set.res[i]===false?'no':i===set.i?'now':''}"></i>`).join('')}</span></div>
   <div id="qb"></div><p class="mute">一組 4 題，答對 3 題就能進到下一層。</p></div>`;
  $('#body').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{cur.set=newSet(+b.dataset.pt);drawPractice();});
  drawQ($('#qb'),set.qs[set.i],async(ok,val)=>{set.res[set.i]=ok;const tr=p.tiers[set.t];tr.n++;if(ok)tr.c++;
    S.log(me.seat,{t:now(),k:'answer',m:cur.m,tier:set.t,ok,a:String(val).slice(0,30),q:set.qs[set.i].key});
    set.i++;
    if(set.i>=4){const c=set.res.filter(Boolean).length;set.done=true;if(c>=3&&!tr.passed){tr.passed=true;S.log(me.seat,{t:now(),k:'tier',m:cur.m,tier:set.t});}await save(cur.m);
      $('#body').innerHTML=`<div class="card">${c>=3?`<span class="big-ok">${L.TIERS[set.t]}通過！</span><p>4 題答對 ${c} 題。</p>`:`<h3 style="margin-top:0">4 題答對 ${c} 題</h3><p>差一點！回去看看觀念和例題，再練一組新的題目。</p>`}
       <div class="row"><button class="btn p" id="go">${c>=3?(p.tiers.every(x=>x.passed)?'繼續':'進到下一層 →'):'再練一組'}</button>${c<3?'<button class="btn" id="cc">回去看觀念</button>':''}</div></div>`;
      $('#go').onclick=()=>{cur.set=null;drawPractice();};if($('#cc'))$('#cc').onclick=()=>{cur.tab='concept';drawModule();};}
    else{await save(cur.m);drawPractice();}});
}
function drawExit(){
  const p=P(cur.m);
  if(!cur.exit||cur.exit.done){const base=(now()%100000)*13+5;cur.exit={qs:[0,1,2].map(t=>L.makeQ(cur.m,t,base+t*17)),i:0,res:[]};}
  const ex=cur.exit;
  $('#body').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>出場券・第 ${ex.i+1} / 3 題</b><span class="dots">${ex.qs.map((_,i)=>`<i class="${ex.res[i]===true?'ok':ex.res[i]===false?'no':i===ex.i?'now':''}"></i>`).join('')}</span></div>
   <div id="qb"></div><p class="mute">3 題全對就完成這個關卡。</p></div>`;
  drawQ($('#qb'),ex.qs[ex.i],async(ok,val)=>{ex.res[ex.i]=ok;S.log(me.seat,{t:now(),k:'answer',m:cur.m,tier:'exit',ok,a:String(val).slice(0,30),q:ex.qs[ex.i].key});ex.i++;
    if(ex.i<3){drawExit();return;}
    ex.done=true;p.exit.tries++;const all=ex.res.every(Boolean);
    if(all){p.exit.passed=true;if(p.status!=='done'){p.status='done';p.doneAt=now();}}
    S.log(me.seat,{t:now(),k:'exit',m:cur.m,ok:all});await save(cur.m);
    $('#body').innerHTML=`<div class="card">${all?`<span class="big-ok">恭喜過關！</span><p>你完成了「${esc(L.CAT[cur.m].name)}」。</p><div class="row"><button class="btn p" id="home">回到路線，看下一關</button></div>`
      :`<h3 style="margin-top:0">3 題答對 ${ex.res.filter(Boolean).length} 題</h3><p>出場券要全對才能過關。看一下錯的地方，再挑戰一次（題目數字會換）。</p><div class="row"><button class="btn p" id="re">再挑戰一次</button><button class="btn" id="pr">回去練習</button></div>`}</div>`;
    if($('#home'))$('#home').onclick=showHome;if($('#re'))$('#re').onclick=drawExit;if($('#pr'))$('#pr').onclick=()=>{cur.tab='practice';cur.set=newSet(2);drawModule();};});
}

async function startPreview(){
  if(S.mode==='firebase'){let ok=false;try{const u=await S.user();if(u&&!u.isAnonymous){await S.listStudents();ok=true;}}catch{}
    if(!ok){app.innerHTML=`<div class="card" style="max-width:520px;margin:30px auto 0"><h2>老師預覽</h2><p>這個頁面只有老師可以使用。請先到 <a href="admin.html">老師後台</a> 用 Google 登入，再按後台上方的「預覽所有關卡」。</p></div>`;return;}}
  const real=S;S=Object.assign(Object.create(real),{saveModule:async()=>{},log:async()=>{}});
  me={seat:'preview',name:'老師',route:L.CATALOG.map(c=>c.id),start:-1,bands:[],miss:{}};prog={};
  $('#who').textContent='老師預覽（不存紀錄）';const o=$('#out');o.hidden=false;o.textContent='回到後台';
  o.onclick=()=>{location.href='admin.html'+(/[?&]demo\b/.test(location.search)?'?demo':'');};
  showHome();
}
(async()=>{S=await window.StoreReady;
  if(PREVIEW){startPreview();return;}
  let saved=null;try{saved=JSON.parse(localStorage.getItem('learn-me'));}catch{}
  if(saved){await showLogin();login(saved.seat,saved.name);}else showLogin();
})();
}
</script>
